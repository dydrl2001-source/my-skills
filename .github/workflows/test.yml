name: Verify portable skills
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .agents/skills/video-reader/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_plugin.py --output ../personal-agent-skills.zip
